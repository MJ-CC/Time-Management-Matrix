      Q4: {

        gripClasses: "text-[#1D5B8C]/40 group-hover:text-[#1D5B8C]/70",
        titleHoverClasses: "hover:bg-[#DCE8F2]/70",
        dropHighlightClasses: ["ring-2", "ring-[#1D5B8C]/50"],
      },
      staging: {
        cardClasses: "bg-slate-50 border-slate-200/90 hover:border-slate-300",
        gripClasses: "text-slate-300 group-hover:text-slate-400",
        titleHoverClasses: "hover:bg-slate-100/80",
        emptyTitle: "暫存區目前沒有待辦事項",
        emptyHint: "點擊上方「新增待辦事項」建立任務，再拖曳至左側象限規劃優先順序",
        dropHighlightClasses: ["ring-2", "ring-slate-400", "bg-slate-50/60"],
      },
    };

    const VALID_QUADRANTS = new Set(["Q1", "Q2", "Q3", "Q4", "staging"]);
    const LOCAL_STORAGE_KEY = "eisenhower_time_matrix_tasks_v1";
    const QUADRANT_LABELS_STORAGE_KEY = "eisenhower_quadrant_labels_v1";

    const DEFAULT_QUADRANT_LABELS = {
      Q1: { code: "Q1", title: "緊急 & 重要", action: "立刻做" },
      Q2: { code: "Q2", title: "不緊急 & 重要", action: "排程做" },
      Q3: { code: "Q3", title: "緊急 & 不重要", action: "委派做" },
      Q4: { code: "Q4", title: "不緊急 & 不重要", action: "刪除 / 少做" },
    };

    const state = {
      storageMode: "local",   // "local" | "firebase"
      db: null,
      auth: null,
      appId: DEFAULT_APP_ID,
      user: null,
      isAuthReady: false,
      isLoadingTasks: true,
      unsubscribeSnapshot: null,
      tasks: [],              // 依 createdAt 由舊到新排序
      quadrantLabels: structuredClone(DEFAULT_QUADRANT_LABELS),
      editingTaskId: null,    // 當前正在行內編輯的任務 ID
      draggingTaskId: null,   // 當前正在拖曳的任務 ID
      pendingRender: false,   // 若拖曳期間收到快照，延後至 dragend 再更新
      dragCounters: new Map() // 防止拖曳經過子元素造成閃爍
    };

    function isAppReady() {
      if (state.storageMode === "local") {
        return state.isAuthReady;
      }
      return state.isAuthReady && Boolean(state.user);
    }

    // =========================================================================
    // 4. DOM 元素參照
    // =========================================================================
    const els = {
      totalCountLabel: document.getElementById("total-count-label"),
      errorBanner: document.getElementById("error-banner"),
      errorTitle: document.getElementById("error-title"),
      errorCode: document.getElementById("error-code"),
      errorMessage: document.getElementById("error-message"),
      errorHint: document.getElementById("error-hint"),
      dismissErrorBtn: document.getElementById("dismiss-error-btn"),

      openAddFormBtn: document.getElementById("open-add-form-btn"),
      addTaskForm: document.getElementById("add-task-form"),
      newTaskInput: document.getElementById("new-task-input"),
      cancelAddBtn: document.getElementById("cancel-add-btn"),
      confirmAddBtn: document.getElementById("confirm-add-btn"),

      connectionStatus: document.getElementById("connection-status"),
      statusText: document.getElementById("status-text"),
      userIdDisplay: document.getElementById("user-id-display"),
      copyUidBtn: document.getElementById("copy-uid-btn"),

      lists: {
        Q1: document.getElementById("list-Q1"),
        Q2: document.getElementById("list-Q2"),
        Q3: document.getElementById("list-Q3"),
        Q4: document.getElementById("list-Q4"),
        staging: document.getElementById("list-staging"),
      },
      counts: {
        Q1: document.getElementById("count-Q1"),
        Q2: document.getElementById("count-Q2"),
        Q3: document.getElementById("count-Q3"),
        Q4: document.getElementById("count-Q4"),
        staging: document.getElementById("count-staging"),
      },
      dropzones: Array.from(document.querySelectorAll(".dropzone")),
    };

    // =========================================================================
    // 5. 圖示與狀態提示工具
    // =========================================================================
    function refreshIcons(root = document) {
      if (window.lucide && typeof window.lucide.createIcons === "function") {
        window.lucide.createIcons({ root });
      }
    }

    function setConnectionStatus(type, text) {
      const iconMap = {
        loading: { name: "loader-2", cls: "w-3.5 h-3.5 text-slate-400 animate-spin shrink-0" },
        connected: { name: "check-circle-2", cls: "w-3.5 h-3.5 text-emerald-600 shrink-0" },
        local: { name: "hard-drive", cls: "w-3.5 h-3.5 text-emerald-600 shrink-0" },
        warning: { name: "alert-circle", cls: "w-3.5 h-3.5 text-amber-600 shrink-0" },
        error: { name: "shield-alert", cls: "w-3.5 h-3.5 text-rose-600 shrink-0" },
      };
      const cfg = iconMap[type] || iconMap.loading;

      const oldIcon = els.connectionStatus.querySelector("i, svg");
      const newIcon = document.createElement("i");
      newIcon.setAttribute("data-lucide", cfg.name);
      newIcon.className = cfg.cls;
      if (oldIcon) {
        oldIcon.replaceWith(newIcon);
      } else {
        els.connectionStatus.prepend(newIcon);
      }

      els.statusText.textContent = text;
      refreshIcons(els.connectionStatus);
    }

    function getTroubleshootingHint(code, fallbackMessage = "") {
      const hints = {
        "LOCAL_STORAGE_ERROR": "瀏覽器可能停用了本機儲存空間（如無痕模式或隱私設定限制），請檢查瀏覽器權限。",
        "QuotaExceededError": "瀏覽器 localStorage 儲存空間已滿，請刪除部分舊任務或清理網站資料。",
        "auth/operation-not-allowed": "請前往 Firebase Console → Authentication → Sign-in method，啟用「匿名（Anonymous）」登入方式。",
        "auth/api-key-not-valid": "請檢查 MANUAL_FIREBASE_CONFIG 中的 apiKey 是否正確，或確認 API 金鑰沒有受到網域限制阻擋。",
        "auth/unauthorized-domain": "請前往 Firebase Console → Authentication → Settings → Authorized domains，將目前網域加入允許清單。",
        "auth/network-request-failed": "網路連線失敗，請檢查網路狀態或防火牆設定後重新整理頁面。",
        "permission-denied": "Firestore 權限不足：請確認 Firestore 安全規則允許已登入使用者讀寫 artifacts/{appId}/users/{request.auth.uid}/time_matrix_tasks。",
        "unavailable": "目前無法連線至 Firestore 服務，請確認網路連線或 Firebase 專案狀態。",
      };
      if (code && hints[code]) return hints[code];
      if (fallbackMessage.includes("Missing or insufficient permissions")) {
        return hints["permission-denied"];
      }
      return "請開啟瀏覽器開發者工具 Console 查看詳細記錄，並確認環境設定與權限。";
    }

    function showError(title, errorOrCode, customHint) {
      const code =
        typeof errorOrCode === "string"
          ? errorOrCode
          : errorOrCode?.code || "unknown-error";
      const message =
        typeof errorOrCode === "string"
          ? ""
          : errorOrCode?.message || String(errorOrCode || "未知錯誤");

      els.errorTitle.textContent = title;
      els.errorCode.textContent = code ? `[${code}]` : "";
      els.errorMessage.textContent = message;
      els.errorHint.textContent = customHint || getTroubleshootingHint(code, message);
      els.errorBanner.classList.remove("hidden");
      refreshIcons(els.errorBanner);
    }

    function hideError() {
      els.errorBanner.classList.add("hidden");
    }

    function setInteractiveEnabled(enabled) {
      els.openAddFormBtn.disabled = !enabled;
      if (!enabled) {
        closeAddForm();
      }
    }

    // =========================================================================
    // 6. Firestore 集合與時間戳記處理
    // =========================================================================
    function getTasksCollectionRef() {
      return collection(
        state.db,
        "artifacts",
        state.appId,
        "users",
        state.user.uid,
        "time_matrix_tasks"
      );
    }

    function getTaskDocRef(taskId) {
      return doc(
        state.db,
        "artifacts",
        state.appId,
        "users",
        state.user.uid,
        "time_matrix_tasks",
        taskId
      );
    }

    function getCreatedAtMs(task) {
      const ts = task.createdAt;
      if (!ts) return Number.MAX_SAFE_INTEGER;
      if (typeof ts.toMillis === "function") return ts.toMillis();
      if (typeof ts.seconds === "number") return ts.seconds * 1000 + Math.floor((ts.nanoseconds || 0) / 1e6);
      if (ts instanceof Date) return ts.getTime();
      if (typeof ts === "number") return ts;
      return Number.MAX_SAFE_INTEGER;
    }

    // =========================================================================
    // 7. 渲染邏輯（確保不破壞正在編輯的輸入框或進行中的拖曳）
    // =========================================================================
    function createEmptyStateElement(quadrant) {
      const meta = QUADRANT_META[quadrant];
      const wrapper = document.createElement("div");
      wrapper.className = "h-full min-h-[140px] flex flex-col items-center justify-center text-center px-4 py-6 text-slate-400 select-none";

      if (state.isLoadingTasks && state.isAuthReady) {
        wrapper.innerHTML = `
          <i data-lucide="loader-2" class="w-5 h-5 mb-2 text-slate-300 animate-spin"></i>
          <p class="text-xs font-medium text-slate-400">載入任務中...</p>
        `;
        return wrapper;
      }

      const hasText = Boolean(meta.emptyTitle || meta.emptyHint);
      const iconName = quadrant === "staging" ? "inbox" : "arrow-down-to-dot";
      const iconEl = document.createElement("i");
      iconEl.setAttribute("data-lucide", iconName);
      iconEl.className = hasText
        ? "w-5 h-5 mb-2 text-slate-300"
        : "w-5 h-5 text-slate-300";

      wrapper.appendChild(iconEl);

      if (meta.emptyTitle) {
        const titleEl = document.createElement("p");
        titleEl.className = "text-xs font-medium text-slate-500";
        titleEl.textContent = meta.emptyTitle;
        wrapper.appendChild(titleEl);
      }

      if (meta.emptyHint) {
        const hintEl = document.createElement("p");
        hintEl.className = "text-[11px] text-slate-400 mt-1 max-w-[240px] leading-relaxed";
        hintEl.textContent = meta.emptyHint;
        wrapper.appendChild(hintEl);
      }

      return wrapper;
    }

    function createTaskCardElement(task) {
      const canInteract = isAppReady();
      const isEditing = state.editingTaskId === task.id;
      const meta = QUADRANT_META[task.quadrant] || QUADRANT_META.staging;

      const card = document.createElement("div");
      card.className =
        `task-card group flex items-start gap-2.5 ${meta.cardClasses} border rounded-lg px-3 py-2.5 shadow-sm hover:shadow transition-all duration-150`;
      card.dataset.taskId = task.id;
      card.dataset.quadrant = task.quadrant;
      card.draggable = canInteract && !isEditing;

      // 拖曳握把提示圖示
      const gripWrap = document.createElement("span");
      gripWrap.className = `mt-0.5 ${meta.gripClasses} shrink-0 select-none`;
      gripWrap.setAttribute("aria-hidden", "true");
      const gripIcon = document.createElement("i");
      gripIcon.setAttribute("data-lucide", "grip-vertical");
      gripIcon.className = "w-3.5 h-3.5";
      gripWrap.appendChild(gripIcon);

      // 中央內容區：標題顯示或行內編輯輸入框
      const body = document.createElement("div");
      body.className = "flex-1 min-w-0";

      if (isEditing) {
        const input = document.createElement("input");
        input.type = "text";
        input.maxLength = 200;
        input.value = task.title;
        input.dataset.editInputFor = task.id;
        input.className =
          "w-full px-2 py-0.5 -mx-2 -my-0.5 text-sm text-slate-900 bg-white border border-slate-400 rounded focus:outline-none focus:border-slate-900 focus:ring-2 focus:ring-slate-900/10";
        input.setAttribute("aria-label", "編輯任務標題");

        let isFinished = false;
        const commitEdit = async (shouldSave) => {
          if (isFinished) return;
          isFinished = true;

          const trimmed = input.value.trim();
          state.editingTaskId = null;

          if (!shouldSave || !trimmed || trimmed === task.title) {
            // 若清空或取消或未修改，直接還原顯示原標題
            renderAll();
            return;
          }

          await handleUpdateTaskTitle(task.id, trimmed);
        };

        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            commitEdit(true);
          } else if (e.key === "Escape") {
            e.preventDefault();
            commitEdit(false);
          }
        });

        input.addEventListener("blur", () => {
          commitEdit(true);
        });

        body.appendChild(input);
      } else {
        const titleEl = document.createElement("div");
        if (canInteract) {
          titleEl.setAttribute("role", "button");
          titleEl.tabIndex = 0;
        }
        titleEl.className =
          `w-full text-left text-sm text-[#2B2D42] leading-snug break-words select-none rounded px-1 -mx-1 py-0.5 ${canInteract ? meta.titleHoverClasses : ""} focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900/20 transition-colors`;
        titleEl.textContent = task.title;
        titleEl.title = canInteract ? "點兩下以編輯標題" : "";

        // 鍵盤 Enter / Space 支援開啟編輯；滑鼠透過卡片點兩下 (dblclick) 觸發
        titleEl.addEventListener("keydown", (e) => {
          if (!isAppReady()) return;
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            e.stopPropagation();
            startInlineEdit(task.id);
          }
        });

        body.appendChild(titleEl);
      }

      // 刪除按鈕
      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.disabled = !canInteract;
      deleteBtn.dataset.action = "delete";
      deleteBtn.className =
        "shrink-0 p-1 -mr-1 rounded-md text-slate-400 hover:text-rose-600 hover:bg-rose-50 sm:opacity-0 sm:group-hover:opacity-100 focus:opacity-100 transition-all duration-150 disabled:pointer-events-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose-500";
      deleteBtn.setAttribute("aria-label", `刪除任務：${task.title}`);
      deleteBtn.title = "刪除任務";

      const trashIcon = document.createElement("i");
      trashIcon.setAttribute("data-lucide", "trash-2");
      trashIcon.className = "w-3.5 h-3.5";
      deleteBtn.appendChild(trashIcon);

      deleteBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        await handleDeleteTask(task.id);
      });
      deleteBtn.addEventListener("dblclick", (e) => {
        e.stopPropagation();
      });

      // 點兩下整張卡片即可修改標題
      card.addEventListener("dblclick", (e) => {
        if (!canInteract || state.editingTaskId === task.id) return;
        if (e.target.closest('[data-action="delete"]')) return;
        e.stopPropagation();
        startInlineEdit(task.id);
      });

      // 拖曳事件
      card.addEventListener("dragstart", (e) => {
        if (!canInteract) {
          e.preventDefault();
          return;
        }
        if (state.editingTaskId === task.id) {
          const activeInput = card.querySelector(`input[data-edit-input-for="${CSS.escape(task.id)}"]`);
          if (activeInput) {
            e.preventDefault();
            return;
          }
          state.editingTaskId = null;
        }
        state.draggingTaskId = task.id;
        card.classList.add("is-dragging");
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", task.id);
        }
      });

      card.addEventListener("dragend", () => {
        card.classList.remove("is-dragging");
        state.draggingTaskId = null;
        clearAllDropHighlights();

        if (state.pendingRender) {
          state.pendingRender = false;
          renderAll();
        }
      });

      card.append(gripWrap, body, deleteBtn);
      return card;
    }

    function startInlineEdit(taskId) {
      state.editingTaskId = taskId;
      renderAll();

      // 聚焦並選取剛建立的編輯輸入框
      const input = document.querySelector(`input[data-edit-input-for="${CSS.escape(taskId)}"]`);
      if (input) {
        input.focus();
        input.select();
      }
    }

    function renderZone(quadrant, zoneTasks) {
      const container = els.lists[quadrant];
      if (!container) return;

      // 更新數量計數
      if (els.counts[quadrant]) {
        els.counts[quadrant].textContent = String(zoneTasks.length);
      }

      // 只有當該卡片「已經處於編輯中（內含 <input>）」時才保留 DOM，避免剛切換進編輯模式時被誤跳過
      const activeEditInput =
        state.editingTaskId &&
        container.querySelector(`input[data-edit-input-for="${CSS.escape(state.editingTaskId)}"]`);
      const activeEditCard = activeEditInput ? activeEditInput.closest(".task-card") : null;

      if (activeEditCard) {
        // 只重建或更新非編輯中的相鄰項目，確保輸入框焦點與文字完全不中斷
        const existingEmpty = container.querySelector(":scope > div:not(.task-card)");
        if (existingEmpty) existingEmpty.remove();

        const targetIds = new Set(zoneTasks.map((t) => t.id));
        Array.from(container.children).forEach((child) => {
          const cid = child.dataset?.taskId;
          if (cid && cid !== state.editingTaskId && !targetIds.has(cid)) {
            child.remove();
          }
        });

        let cursorNode = container.firstElementChild;
        for (const task of zoneTasks) {
          if (task.id === state.editingTaskId) {
            if (cursorNode === activeEditCard) {
              cursorNode = cursorNode.nextElementSibling;
            } else {
              container.insertBefore(activeEditCard, cursorNode);
            }
            continue;
          }

          const existingCard = container.querySelector(
            `[data-task-id="${CSS.escape(task.id)}"]`
          );
          const freshCard = createTaskCardElement(task);
          if (existingCard) {
            container.replaceChild(freshCard, existingCard);
          } else {
            container.insertBefore(freshCard, cursorNode);
          }
          refreshIcons(freshCard);
          cursorNode = freshCard.nextElementSibling;
        }
        return;
      }

      // 一般情況：清空並依序渲染
      container.innerHTML = "";
      if (zoneTasks.length === 0) {
        const emptyEl = createEmptyStateElement(quadrant);
        container.appendChild(emptyEl);
        refreshIcons(emptyEl);
        return;
      }

      const fragment = document.createDocumentFragment();
      for (const task of zoneTasks) {
        fragment.appendChild(createTaskCardElement(task));
      }
      container.appendChild(fragment);
      refreshIcons(container);
    }

    function renderAll() {
      // 拖曳進行中不可銷毀 DOM 元素，否則瀏覽器會中止 dragend
      if (state.draggingTaskId !== null) {
        state.pendingRender = true;
        return;
      }

      const grouped = {
        Q1: [],
        Q2: [],
        Q3: [],
        Q4: [],
        staging: [],
      };

      for (const task of state.tasks) {
        const target = VALID_QUADRANTS.has(task.quadrant) ? task.quadrant : "staging";
        grouped[target].push(task);
      }

      els.totalCountLabel.textContent = `共 ${state.tasks.length} 項任務`;

      for (const quadrant of VALID_QUADRANTS) {
        renderZone(quadrant, grouped[quadrant]);
      }
    }

    // =========================================================================
    // 8. 資料儲存層（支援 localStorage 本機儲存與 Firestore 雲端同步）
    // =========================================================================
    function generateLocalId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return `local_${Date.now()}_${Math.random().toString(36).slice(2, 9)}`;
    }

    function loadLocalTasks() {
      try {
        const raw = window.localStorage.getItem(LOCAL_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        const items = parsed
          .filter((item) => item && typeof item.id === "string" && typeof item.title === "string")
          .map((item) => ({
            id: item.id,
            title: item.title,
            quadrant: VALID_QUADRANTS.has(item.quadrant) ? item.quadrant : "staging",
            createdAt: typeof item.createdAt === "number" ? item.createdAt : Date.now(),
          }));
        items.sort((a, b) => getCreatedAtMs(a) - getCreatedAtMs(b));
        return items;
      } catch (err) {
        showError("讀取本機儲存失敗", err?.name || "LOCAL_STORAGE_ERROR");
        return [];
      }
    }

    function saveLocalTasks(tasks) {
      try {
        window.localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(tasks));
        return true;
      } catch (err) {
        showError("寫入本機儲存失敗", err?.name || "LOCAL_STORAGE_ERROR");
        return false;
      }
    }

    async function handleAddTask(rawTitle) {
      const title = rawTitle.trim();
      if (!title || !isAppReady()) return false;

      els.confirmAddBtn.disabled = true;
      try {
        if (state.storageMode === "local") {
          const lastMs = state.tasks.length > 0 ? getCreatedAtMs(state.tasks[state.tasks.length - 1]) : 0;
          const nowMs = Math.max(Date.now(), lastMs + 1);
          const nextTasks = [
            ...state.tasks,
            {
              id: generateLocalId(),
              title,
              quadrant: "staging",
              createdAt: nowMs,
            },
          ];
          if (!saveLocalTasks(nextTasks)) return false;
          state.tasks = nextTasks;
          hideError();
          renderAll();
          return true;
        }

        await addDoc(getTasksCollectionRef(), {
          title,
          quadrant: "staging",
          createdAt: serverTimestamp(),
        });
        hideError();
        return true;
      } catch (err) {
        showError("新增任務失敗", err);
        return false;
      } finally {
        els.confirmAddBtn.disabled = false;
      }
    }

    async function handleUpdateTaskTitle(taskId, newTitle) {
      if (!isAppReady()) return;
      const task = state.tasks.find((t) => t.id === taskId);
      if (!task) return;

      const prevTitle = task.title;
      task.title = newTitle;
      renderAll();

      if (state.storageMode === "local") {
        if (!saveLocalTasks(state.tasks)) {
          task.title = prevTitle;
          renderAll();
        } else {
          hideError();
        }
        return;
      }

      try {
        await updateDoc(getTaskDocRef(taskId), { title: newTitle });
        hideError();
      } catch (err) {
        task.title = prevTitle;
        renderAll();
        showError("更新任務標題失敗", err);
      }
    }

    async function handleMoveTask(taskId, targetQuadrant) {
      if (!isAppReady()) return;
      if (!VALID_QUADRANTS.has(targetQuadrant)) return;

      const task = state.tasks.find((t) => t.id === taskId);
      if (!task || task.quadrant === targetQuadrant) return;

      const previousQuadrant = task.quadrant;
      task.quadrant = targetQuadrant;
      if (state.draggingTaskId === null) {
        renderAll();
      } else {
        state.pendingRender = true;
      }

      if (state.storageMode === "local") {
        if (!saveLocalTasks(state.tasks)) {
          task.quadrant = previousQuadrant;
          renderAll();
        } else {
          hideError();
        }
        return;
      }

      try {
        await updateDoc(getTaskDocRef(taskId), {
          quadrant: targetQuadrant,
        });
        hideError();
      } catch (err) {
        task.quadrant = previousQuadrant;
        renderAll();
        showError("移動任務失敗", err);
      }
    }

    async function handleDeleteTask(taskId) {
      if (!isAppReady()) return;

      if (state.editingTaskId === taskId) {
        state.editingTaskId = null;
      }

      if (state.storageMode === "local") {
        const prevTasks = state.tasks;
        state.tasks = state.tasks.filter((t) => t.id !== taskId);
        if (!saveLocalTasks(state.tasks)) {
          state.tasks = prevTasks;
        } else {
          hideError();
        }
        renderAll();
        return;
      }

      try {
        await deleteDoc(getTaskDocRef(taskId));
        hideError();
      } catch (err) {
        showError("刪除任務失敗", err);
      }
    }

    // =========================================================================
    // 9. 拖曳投放區 (Dropzone) 綁定
    // =========================================================================
    function applyDropHighlight(zoneEl, quadrant) {
      const classes = QUADRANT_META[quadrant]?.dropHighlightClasses || [];
      zoneEl.classList.add(...classes);
    }

    function removeDropHighlight(zoneEl, quadrant) {
      const classes = QUADRANT_META[quadrant]?.dropHighlightClasses || [];
      zoneEl.classList.remove(...classes);
    }

    function clearAllDropHighlights() {
      state.dragCounters.clear();
      for (const zoneEl of els.dropzones) {
        const quadrant = zoneEl.dataset.quadrant;
        removeDropHighlight(zoneEl, quadrant);
      }
    }

    function setupDropzones() {
      for (const zoneEl of els.dropzones) {
        const quadrant = zoneEl.dataset.quadrant;

        zoneEl.addEventListener("dragenter", (e) => {
          if (!isAppReady() || !state.draggingTaskId) return;
          e.preventDefault();
          const nextCount = (state.dragCounters.get(quadrant) || 0) + 1;
          state.dragCounters.set(quadrant, nextCount);
          if (nextCount === 1) {
            applyDropHighlight(zoneEl, quadrant);
          }
        });

        zoneEl.addEventListener("dragover", (e) => {
          if (!isAppReady() || !state.draggingTaskId) return;
          e.preventDefault();
          if (e.dataTransfer) {
            e.dataTransfer.dropEffect = "move";
          }
        });

        zoneEl.addEventListener("dragleave", () => {
          const current = state.dragCounters.get(quadrant) || 0;
          const next = Math.max(0, current - 1);
          state.dragCounters.set(quadrant, next);
          if (next === 0) {
            removeDropHighlight(zoneEl, quadrant);
          }
        });

        zoneEl.addEventListener("drop", async (e) => {
          e.preventDefault();
          clearAllDropHighlights();

          if (!isAppReady()) return;
          const droppedTaskId =
            state.draggingTaskId || e.dataTransfer?.getData("text/plain");
          if (!droppedTaskId) return;

          state.draggingTaskId = null;
          state.pendingRender = false;
          await handleMoveTask(droppedTaskId, quadrant);
          renderAll();
        });
      }
    }

    // =========================================================================
    // 10. 新增表單與 UI 事件綁定
    // =========================================================================
    function openAddForm() {
      if (!isAppReady()) return;
      els.addTaskForm.classList.remove("hidden");
      els.newTaskInput.value = "";
      els.newTaskInput.focus();
    }

    function closeAddForm() {
      els.addTaskForm.classList.add("hidden");
      els.newTaskInput.value = "";
    }

    function setupUIEvents() {
      els.dismissErrorBtn.addEventListener("click", hideError);

      els.openAddFormBtn.addEventListener("click", () => {
        if (els.addTaskForm.classList.contains("hidden")) {
          openAddForm();
        } else {
          els.newTaskInput.focus();
        }
      });

      els.cancelAddBtn.addEventListener("click", closeAddForm);

      els.newTaskInput.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          closeAddForm();
        }
      });

      els.addTaskForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const value = els.newTaskInput.value.trim();
        if (!value) {
          els.newTaskInput.focus();
          return;
        }
        const ok = await handleAddTask(value);
        if (ok) {
          els.newTaskInput.value = "";
          els.newTaskInput.focus();
        }
      });

      els.copyUidBtn.addEventListener("click", async () => {
        if (!state.user?.uid) return;
        try {
          await navigator.clipboard.writeText(state.user.uid);
          const icon = els.copyUidBtn.querySelector("i, svg");
          if (icon) {
            const checkIcon = document.createElement("i");
            checkIcon.setAttribute("data-lucide", "check");
            checkIcon.className = "w-3 h-3 text-emerald-600";
            icon.replaceWith(checkIcon);
            refreshIcons(els.copyUidBtn);
            setTimeout(() => {
              const curr = els.copyUidBtn.querySelector("i, svg");
              if (curr) {
                const copyIcon = document.createElement("i");
                copyIcon.setAttribute("data-lucide", "copy");
                copyIcon.className = "w-3 h-3";
                curr.replaceWith(copyIcon);
                refreshIcons(els.copyUidBtn);
              }
            }, 1500);
          }
        } catch {
          // 忽略剪貼簿權限錯誤
        }
      });
    }

    // =========================================================================
    // 10.5 四象限標題與行動標籤自訂編輯（儲存於 localStorage）
    // =========================================================================
    function loadQuadrantLabels() {
      const next = structuredClone(DEFAULT_QUADRANT_LABELS);
      try {
        const raw = window.localStorage.getItem(QUADRANT_LABELS_STORAGE_KEY);
        if (!raw) return next;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return next;
        for (const q of ["Q1", "Q2", "Q3", "Q4"]) {
          if (parsed[q] && typeof parsed[q] === "object") {
            for (const field of ["code", "title", "action"]) {
              if (typeof parsed[q][field] === "string" && parsed[q][field].trim()) {
                next[q][field] = parsed[q][field].trim();
              }
            }
          }
        }
      } catch {
        // 忽略本機讀取錯誤並使用預設標籤
      }
      return next;
    }

    function saveQuadrantLabels() {
      try {
        window.localStorage.setItem(
          QUADRANT_LABELS_STORAGE_KEY,
          JSON.stringify(state.quadrantLabels)
        );
      } catch (err) {
        showError("儲存象限標籤失敗", err?.name || "LOCAL_STORAGE_ERROR");
      }
    }

    function renderQuadrantLabels() {
      const labelEls = document.querySelectorAll("[data-label-quadrant][data-label-field]");
      for (const el of labelEls) {
        if (el.dataset.isEditing === "true") continue;
        const q = el.dataset.labelQuadrant;
        const field = el.dataset.labelField;
        const text = state.quadrantLabels[q]?.[field];
        if (typeof text === "string") {
          el.textContent = text;
        }
      }
    }

    function startQuadrantLabelEdit(el) {
      if (el.dataset.isEditing === "true") return;
      const q = el.dataset.labelQuadrant;
      const field = el.dataset.labelField;
      const currentValue = state.quadrantLabels[q]?.[field] ?? el.textContent.trim();

      el.dataset.isEditing = "true";
      const hadTruncate = el.classList.contains("truncate");
      if (hadTruncate) {
        el.classList.remove("truncate");
      }

      const input = document.createElement("input");
      input.type = "text";
      input.maxLength = field === "code" ? 12 : field === "action" ? 20 : 40;
      input.value = currentValue;
      input.setAttribute("aria-label", "編輯象限標籤");

      const widthClass =
        field === "code"
          ? "w-14 font-mono text-xs font-semibold"
          : field === "action"
          ? "w-24 text-xs font-medium"
          : "w-36 sm:w-44 text-sm font-semibold";
      input.className = `${widthClass} px-1.5 py-0.5 text-slate-900 bg-white border border-slate-400 rounded focus:outline-none focus:border-slate-900 focus:ring-2 focus:ring-slate-900/10`;

      el.textContent = "";
      el.appendChild(input);
      input.focus();
      input.select();

      let finished = false;
      const finishEdit = (shouldSave) => {
        if (finished) return;
        finished = true;

        const trimmed = input.value.trim();
        const nextValue = shouldSave && trimmed ? trimmed : currentValue;
        if (state.quadrantLabels[q]) {
          state.quadrantLabels[q][field] = nextValue;
        }
        delete el.dataset.isEditing;
        if (hadTruncate) {
          el.classList.add("truncate");
        }
        el.textContent = nextValue;

        if (shouldSave && trimmed && trimmed !== currentValue) {
          saveQuadrantLabels();
        }
      };

      input.addEventListener("click", (e) => e.stopPropagation());
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          finishEdit(true);
        } else if (e.key === "Escape") {
          e.preventDefault();
          finishEdit(false);
        }
      });
      input.addEventListener("blur", () => finishEdit(true));
    }

    function setupEditableQuadrantLabels() {
      state.quadrantLabels = loadQuadrantLabels();
      renderQuadrantLabels();

      const labelEls = document.querySelectorAll("[data-label-quadrant][data-label-field]");
      for (const el of labelEls) {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          startQuadrantLabelEdit(el);
        });
        el.addEventListener("keydown", (e) => {
          if (e.target !== el) return;
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            startQuadrantLabelEdit(el);
          }
        });
      }

      window.addEventListener("storage", (e) => {
        if (e.key === QUADRANT_LABELS_STORAGE_KEY) {
          state.quadrantLabels = loadQuadrantLabels();
          renderQuadrantLabels();
        }
      });
    }

    // =========================================================================
    // 11. Firebase 初始化、匿名登入與即時監聽
    // =========================================================================
    function resolveFirebaseConfig() {
      // 支援注入環境變數（若有）或使用頂端 MANUAL_FIREBASE_CONFIG
      if (typeof window.__app_id === "string" && window.__app_id.trim()) {
        state.appId = window.__app_id.trim();
      } else {
        state.appId = DEFAULT_APP_ID;
      }

      if (typeof window.__firebase_config !== "undefined" && window.__firebase_config) {
        try {
          const parsed =
            typeof window.__firebase_config === "string"
              ? JSON.parse(window.__firebase_config)
              : window.__firebase_config;
          if (parsed && parsed.apiKey && parsed.projectId) {
            return parsed;
          }
        } catch (err) {
          console.warn("解析 __firebase_config 失敗，改用 MANUAL_FIREBASE_CONFIG", err);
        }
      }

      return MANUAL_FIREBASE_CONFIG;
    }

    function subscribeToTasks() {
      if (state.unsubscribeSnapshot) {
        state.unsubscribeSnapshot();
        state.unsubscribeSnapshot = null;
      }

      state.isLoadingTasks = true;
      renderAll();

      const q = query(getTasksCollectionRef(), orderBy("createdAt", "asc"));

      state.unsubscribeSnapshot = onSnapshot(
        q,
        (snapshot) => {
          state.isLoadingTasks = false;
          const items = snapshot.docs.map((docSnap) => {
            const data = docSnap.data({ serverTimestamps: "estimate" });
            return {
              id: docSnap.id,
              title: typeof data.title === "string" ? data.title : "",
              quadrant: VALID_QUADRANTS.has(data.quadrant) ? data.quadrant : "staging",
              createdAt: data.createdAt || null,
            };
          });

          // 二次排序：確保尚未收到伺服器時間戳的本地樂觀寫入項目維持依建立順序由舊到新
          items.sort((a, b) => getCreatedAtMs(a) - getCreatedAtMs(b));
          state.tasks = items;
          setConnectionStatus("connected", "即時同步中");
          renderAll();
        },
        (error) => {
          state.isLoadingTasks = false;
          setConnectionStatus("error", "資料同步失敗");
          showError("Firestore 即時監聽發生錯誤", error);
          renderAll();
        }
      );
    }

    function initLocalStorageMode() {
      state.storageMode = "local";
      state.user = null;
      state.isAuthReady = true;
      state.isLoadingTasks = false;
      state.tasks = loadLocalTasks();

      els.userIdDisplay.textContent = "本機瀏覽器";
      els.userIdDisplay.title = "資料儲存於目前瀏覽器的 localStorage";
      els.copyUidBtn.classList.add("hidden");
      setInteractiveEnabled(true);
      setConnectionStatus("local", "本機儲存模式 (localStorage)");
      renderAll();

      // 同一瀏覽器多分頁開啟時自動同步
      window.addEventListener("storage", (e) => {
        if (state.storageMode === "local" && e.key === LOCAL_STORAGE_KEY) {
          state.tasks = loadLocalTasks();
          renderAll();
        }
      });
    }

    async function initStorage() {
      const config = resolveFirebaseConfig();

      // 未填入 Firebase 設定時，自動啟用 localStorage 本機儲存模式
      if (!config || !config.apiKey || !config.projectId || !config.appId) {
        initLocalStorageMode();
        return;
      }

      state.storageMode = "firebase";
      try {
        const app = initializeApp(config);
        state.auth = getAuth(app);
        state.db = getFirestore(app);

        onAuthStateChanged(state.auth, (user) => {
          if (user) {
            state.user = user;
            state.isAuthReady = true;
            els.userIdDisplay.textContent = user.uid;
            els.userIdDisplay.title = user.uid;
            els.copyUidBtn.classList.remove("hidden");
            setInteractiveEnabled(true);
            setConnectionStatus("loading", "同步資料中...");
            subscribeToTasks();
          } else {
            state.user = null;
            state.isAuthReady = false;
            els.userIdDisplay.textContent = "未登入";
            els.userIdDisplay.title = "";
            els.copyUidBtn.classList.add("hidden");
            setInteractiveEnabled(false);
            if (state.unsubscribeSnapshot) {
              state.unsubscribeSnapshot();
              state.unsubscribeSnapshot = null;
            }
          }
        });

        setConnectionStatus("loading", "正在匿名登入...");
        if (typeof window.__initial_auth_token === "string" && window.__initial_auth_token) {
          await signInWithCustomToken(state.auth, window.__initial_auth_token);
        } else {
          await signInAnonymously(state.auth);
        }
      } catch (err) {
        state.isAuthReady = false;
        state.isLoadingTasks = false;
        setInteractiveEnabled(false);
        setConnectionStatus("error", "匿名登入失敗");
        showError("Firebase 初始化或匿名登入失敗", err);
        renderAll();
      }
    }

    // =========================================================================
    // 12. 啟動應用程式
    // =========================================================================
    refreshIcons();
    setupEditableQuadrantLabels();
    setupDropzones();
    setupUIEvents();
    renderAll();
    initStorage();
  </script>
</body>
</html>
